services:
  # 1. THE DATABASE
  db:
    image: postgres:15
    container_name: bio-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # Use variables from .env
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # The backend's first act is `migrate`, which exits non-zero if Postgres is
    # not yet accepting connections. `restart: unless-stopped` papered over that
    # by retrying the whole container; gating on health makes the start ordered
    # instead of a race that usually resolves itself.
    # $$ so Compose leaves the expansion to the shell inside the container,
    # where the postgres image has already set these.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # 2. THE BACKEND (Django)
  backend:
    build: ./backend
    container_name: bio-backend
    # `manage.py runserver` is a development server and was never meant to
    # face the internet. gunicorn was already in requirements.txt, unused.
    # collectstatic is required because WhiteNoise uses the manifest storage;
    # migrate keeps a deploy self-sufficient (single instance, so no race).
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -"
    volumes:
      # Only the upload directory is mounted. Application code now comes from
      # the image (the deploy rebuilds it), so the running container cannot
      # modify the source checkout, and only MEDIA_ROOT needs to persist
      # across container recreates.
      - ./backend/media:/app/media
    # No host port published: the tunnel reaches this by container DNS, so
    # publishing one would only widen LAN exposure.
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      # dynamically build the URL using the same variables
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@bio-db:5432/${POSTGRES_DB}
      # ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS used to be set here and were
      # never read: config/settings.py assigns both as literals and consults no
      # environment variable for either. Worse, the values here had drifted --
      # they omitted www.guimoneda.com and bio-backend, so this block described
      # a policy the application did not have. The real list lives in
      # config/settings.py; change it there.
    restart: unless-stopped

  # 3. THE FRONTEND (compiled SPA behind nginx)
  frontend:
    # Built from frontend/Dockerfile: compiled once at image build time and
    # served by nginx. Previously this mounted the source and ran the webpack
    # dev server plus a type-checker in production, which exhausted memory on
    # the NAS and crash-looped the site. Nothing compiles at runtime now.
    build: ./frontend
    container_name: bio-frontend
    # No host port and no source mount: the tunnel reaches this by container
    # DNS (http://bio-frontend:3000), which is also the ingress rule already
    # configured in Cloudflare, so that needs no change.
    restart: unless-stopped

  # 4. THE TUNNEL
  cloudflared:
    # Pinned rather than :latest, for the reason the deploy tooling was pinned:
    # an unpinned tag lets the thing carrying all inbound traffic change with
    # no commit to point at. This is also the one container a deploy never
    # recreates (see scripts/nas-pull-deploy.sh), so drift here would surface
    # only on a manual restart, far from whatever caused it. Bump on purpose.
    image: cloudflare/cloudflared:2026.9.1
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    # No ports needed, it talks to the containers internally.
    #
    # No extra_hosts either. The host.docker.internal:host-gateway mapping that
    # used to be here gave the tunnel a route to the NAS host itself, which is
    # what let GitHub Actions SSH in to deploy. That deploy is gone -- the NAS
    # pulls instead -- so the route has no remaining user, and removing it
    # means a leaked tunnel token can no longer be pointed at host services.
    # Every ingress rule the site needs resolves a container by Docker DNS.

volumes:
  postgres_data:
