name: Playwright Tests

on:
  push:
    branches-ignore: [ main, master ]
  pull_request:
    branches: [ main, master ]

# A second push to the same branch makes the earlier run pointless.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # `npm ci` in both trees: a test run must install exactly what is
      # committed, or it is not testing the branch.
      - name: Install test dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm test -- --watchAll=false
        env:
          CI: 'true'

      # Same flags as frontend/Dockerfile, so CI builds what production serves.
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          CI: 'true'
          INLINE_RUNTIME_CHUNK: 'false'
          GENERATE_SOURCEMAP: 'false'
          DISABLE_ESLINT_PLUGIN: 'true'

      # No pinned Playwright container: it was stuck at v1.41.0 while
      # package.json asks for ^1.58.2. Installing from the lockfile keeps the
      # browsers and the runner in step.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # E2E_LOCAL makes playwright.config.ts start scripts/e2e-server.js, which
      # serves the build above with a stubbed API. This tests the branch rather
      # than the deployed site, so a pull request can be green before release.
      - name: Run Playwright against the build
        run: npx playwright test
        env:
          E2E_LOCAL: '1'
          BASE_URL: http://127.0.0.1:4173

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
