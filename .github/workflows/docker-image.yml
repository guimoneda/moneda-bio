name: Deploy to NAS

on:
  push:
    branches: [ "main" ]

jobs:
  # Ship first. The smoke tests below verify the LIVE site, so they can only
  # run after a deploy — gating deploy on them would deadlock recovery when the
  # site is down (see git history for the outage that taught us this).
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cloudflared
        # Pinned deliberately. `releases/latest` let the deploy's own tooling
        # change without a commit, so a green deploy was not reproducible.
        # Bump this on purpose, not by accident.
        env:
          CLOUDFLARED_VERSION: '2026.9.1'
        run: |
          curl -fsSL --retry 3 --output cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          sudo dpkg -i cloudflared.deb

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Configure SSH to tunnel through Cloudflare
          # NOTE: Ensure 'ssh-moneda' matches your Cloudflare Public Hostname
          echo "Host nas
            HostName "${{ secrets.NAS_HOST }}"
            User "${{ secrets.NAS_USER }}"
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config

      - name: Deploy Files & Update Secrets
        run: |
          # 1. SSH into NAS
          # 2. Create the .env file with ALL secrets (Tunnel + DB), owner-only:
          #    it holds the DB password, Django secret key and tunnel token, so it
          #    must not be readable by other accounts on the host.
          # 3. Pull code and restart

          # Bring up the app services ONLY. `docker compose up -d` with no
          # arguments also recreates cloudflared -- which is the tunnel carrying
          # this very SSH session. It SIGTERMs the transport mid-command, so the
          # deploy severs its own connection and exits 255 ("Broken pipe") after
          # having actually succeeded. cloudflared is left running; restart it by
          # hand on the rare occasion its own config changes.
          ssh nas "cd /volume2/docker/moneda-bio && \
          umask 077 && \
          printf 'TUNNEL_TOKEN=${{ secrets.TUNNEL_TOKEN }}\nPOSTGRES_USER=${{ secrets.POSTGRES_USER }}\nPOSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}\nPOSTGRES_DB=${{ secrets.POSTGRES_DB }}\nDJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}\n' > .env && \
          chmod 600 .env && \
          git fetch origin main && \
          git reset --hard origin/main && \
          docker compose up -d --build db backend frontend"

  # Post-deploy smoke test against the live production site.
  # Runs only if deploy succeeded. A failure here alerts (red X) but cannot
  # block a deploy — the fix has already shipped.
  smoke:
    needs: deploy
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      # Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      # A fresh container reinstalls deps and recompiles (CRA dev server),
      # so wait for the site to answer 200 before testing — avoids false fails.
      - name: Wait for site to be healthy
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://guimoneda.com/ || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::site did not return 200 within ~10 min after deploy" >&2
          exit 1
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
