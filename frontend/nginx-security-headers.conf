# Included explicitly in every context that sets add_header. nginx drops all
# inherited add_header directives as soon as a location declares one of its
# own, so these have to be repeated rather than set once on the server block.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# script-src needs no 'unsafe-inline' because the image builds with
# INLINE_RUNTIME_CHUNK=false, so no JS is inlined into index.html.
# style-src does: motion/react applies animation state as inline styles.
# img-src allows any https origin because a Job may carry an external image_url.
# This is the main defence for the CKEditor HTML rendered via
# dangerouslySetInnerHTML -- an injected <script> there cannot execute.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
