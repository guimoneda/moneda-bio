# Serves the compiled SPA only. /api, /admin, /django_static and /media are
# routed straight to the backend by the Cloudflare Tunnel ingress rules, so
# nginx needs no proxy_pass and no knowledge of the backend at all.
#
# Listens on 3000 to match the existing tunnel rule for this container.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # No real_ip_from/real_ip_header here on purpose: trusting a
    # client-supplied forwarding header without pinning the source is a
    # spoofing risk, and Cloudflare already has the true client address.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    # Hashed build output. Safe to cache forever; a new deploy emits new names.
    location /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Copied verbatim from public/ and therefore NOT content-hashed, so it must
    # revalidate or a stale theme bootstrap outlives the deploy that changed it.
    location = /theme-init.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Client-side routing: unknown paths are React Router's to resolve.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Hidden files are never part of a build output.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
